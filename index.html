<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Let's get to work!</title>
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background-color: #f9f9f9;
  }
  h1 {
    color: #305063;
    margin-bottom: 20px;
  }
  input, select {
    padding: 10px;
    margin: 10px 10px 20px 0;
    font-size: 16px;
  }
  button#suggestBtn, button#editBtn {
    padding: 10px 16px;
    margin: 10px 10px 20px 0;
    font-size: 16px;
    background-color: #305063;
    color: white;
    border: none;
    cursor: pointer;
  }
  #suggestions {
    margin-bottom: 20px;
  }
  #suggestions ol {
    margin: 0;
    padding-left: 20px;
  }
  #suggestions li {
    margin: 6px 0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th {
    background-color: #305063;
    color: white;
    padding: 12px;
  }
  td {
    padding: 12px;
    border-bottom: 1px solid #ccc;
    text-align: left;
  }
  a {
    color: #305063;
    text-decoration: underline;
  }
  .pagination {
    margin-top: 20px;
  }
  .pagination button {
    padding: 8px 12px;
    margin: 0 4px;
  }
</style>
</head>
<body>

<h1>Let's get to work!</h1>

<input type="text" id="searchInput" placeholder="Search by name" />

<select id="filterSelect">
  <option value="">Filter by status</option>
</select>

<button id="suggestBtn" type="button">Suggest a biography to write</button>
<button id="editBtn" type="button">Suggest a biography to edit</button>
<div id="suggestions" aria-live="polite"></div>

<div id="tableContainer"></div>
<div class="pagination" id="pagination"></div>

<script>
  // Tab that feeds the table: name, next step, link
  const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRus4kFg2V9ITptF_g9OZnYV399uqeSrjKKMD8hJZGmKFZs275TDJy1ZxZDVZv_KB5Aed5gjK4_EL78/pub?gid=384521337&single=true&output=csv';

  // "Articles data" tab: used for the "Suggest a biography" button
  const articlesCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRus4kFg2V9ITptF_g9OZnYV399uqeSrjKKMD8hJZGmKFZs275TDJy1ZxZDVZv_KB5Aed5gjK4_EL78/pub?gid=1205421429&single=true&output=csv';

  let fullData = [];
  let articlesData = [];
  let currentPage = 1;
  const rowsPerPage = 50;

  const nameKey = s => (s || "").trim().toLowerCase();

  // Handles quoted cells, commas and quotes inside cells. Skips the header row.
  function parseCsv(text) {
    const rows = [];
    let row = [], cell = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { cell += '"'; i++; }
          else inQuotes = false;
        } else cell += c;
      } else if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(cell); cell = ""; }
      else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ""; }
      else if (c !== '\r') cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows.slice(1);
  }

  function createTable(data) {
    const table = document.createElement("table");
    const thead = document.createElement("thead");
    const tbody = document.createElement("tbody");

    const headers = ["Click the name to edit", "Next step"];
    const trHead = document.createElement("tr");
    headers.forEach(header => {
      const th = document.createElement("th");
      th.textContent = header;
      trHead.appendChild(th);
    });
    thead.appendChild(trHead);

    data.forEach(row => {
      const tr = document.createElement("tr");

      // Columns B = row[1], C = row[2], D = row[3]
      const name = row[1] || "";
      const nextStep = row[2] || "";
      const link = row[3] || "";

      const tdName = document.createElement("td");
      const a = document.createElement("a");
      a.textContent = name;
      a.href = link || "#";
      a.target = "_blank";
      tdName.appendChild(a);
      tr.appendChild(tdName);

      const tdNext = document.createElement("td");
      tdNext.textContent = nextStep;
      tr.appendChild(tdNext);

      tbody.appendChild(tr);
    });

    table.appendChild(thead);
    table.appendChild(tbody);
    return table;
  }

  function paginate(data) {
    const start = (currentPage - 1) * rowsPerPage;
    return data.slice(start, start + rowsPerPage);
  }

  function renderPagination(totalRows) {
    const pageCount = Math.ceil(totalRows / rowsPerPage);
    const container = document.getElementById("pagination");
    container.innerHTML = '';

    for (let i = 1; i <= pageCount; i++) {
      const btn = document.createElement("button");
      btn.textContent = i;
      if (i === currentPage) btn.disabled = true;
      btn.onclick = () => {
        currentPage = i;
        render();
      };
      container.appendChild(btn);
    }
  }

  function render() {
    const searchValue = document.getElementById("searchInput").value.toLowerCase();
    const filterValue = document.getElementById("filterSelect").value;

    let filtered = fullData.filter(row => {
      const name = row[1] || "";
      const nextStep = row[2] || "";
      const nameMatch = name.toLowerCase().includes(searchValue);
      const stepMatch = !filterValue || nextStep === filterValue;
      return nameMatch && stepMatch;
    });

    const paged = paginate(filtered);
    const table = createTable(paged);
    document.getElementById("tableContainer").innerHTML = "";
    document.getElementById("tableContainer").appendChild(table);
    renderPagination(filtered.length);
  }

  // Returns n random items from an array
  function pickRandom(items, n) {
    const copy = items.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy.slice(0, n);
  }

  // Shows a heading and a numbered list of linked names in the results area
  function renderSuggestions(headingText, picks) {
    const container = document.getElementById("suggestions");
    container.innerHTML = "";

    const heading = document.createElement("strong");
    heading.textContent = headingText;
    container.appendChild(heading);

    const ol = document.createElement("ol");
    picks.forEach(item => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.textContent = item.name;
      a.href = item.link;
      a.target = "_blank";
      li.appendChild(a);
      li.appendChild(document.createTextNode(` (${item.citations} citations)`));
      ol.appendChild(li);
    });
    container.appendChild(ol);
  }

  // Suggest three random nominations from those with the highest number of
  // citations where column H ("enough citations for a new article?") is TRUE
  function suggestBiographies() {
    const container = document.getElementById("suggestions");
    container.innerHTML = "";

    if (articlesData.length === 0) {
      container.textContent = "Couldn't load suggestions right now. Please try again later.";
      return;
    }

    // Column H (index 7) = enough citations for a new article
    // Column M (index 12) = Wikidata Q-ID, used to skip duplicate rows for the same person
    const seen = new Set();
    const candidates = articlesData
      .filter(row => (row[7] || "").trim().toUpperCase() === "TRUE")
      .filter(row => nameKey(row[1]))
      .filter(row => {
        const key = (row[12] || "").trim() || nameKey(row[1]);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      })
      .map(row => ({
        name: row[1].trim(),
        link: row[4] || "#",                      // "Link to edit"
        citations: parseInt(row[3], 10) || 0      // column D
      }));

    if (candidates.length === 0) {
      container.textContent = "No assignments currently need a biography.";
      return;
    }

    // Pool = people with the highest citation count, widened to the next-highest
    // counts only if needed to reach at least three people
    const counts = [...new Set(candidates.map(c => c.citations))].sort((a, b) => b - a);
    let pool = [];
    for (const count of counts) {
      pool = pool.concat(candidates.filter(c => c.citations === count));
      if (pool.length >= 3) break;
    }

    renderSuggestions("Try writing one of these:", pickRandom(pool, 3));
  }

  // The edit suggestions are chosen from at least this many of the articles with
  // the fewest citations. Raise it (for example to 10) for more variety.
  const EDIT_POOL_MIN = 3;

  // Suggest three random articles that need edits (column F is TRUE),
  // chosen from those with the lowest number of citations (column P)
  function suggestEdits() {
    const container = document.getElementById("suggestions");
    container.innerHTML = "";

    if (articlesData.length === 0) {
      container.textContent = "Couldn't load suggestions right now. Please try again later.";
      return;
    }

    // Column F (index 5) = article needs edits
    // Column P (index 15) = number of citations in the article
    // Column M (index 12) = Wikidata Q-ID, used to skip duplicate rows for the same person
    const seen = new Set();
    const candidates = articlesData
      .filter(row => (row[5] || "").trim().toUpperCase() === "TRUE")
      .filter(row => nameKey(row[1]))
      .filter(row => /^\d+$/.test((row[15] || "").trim()))
      .filter(row => {
        const key = (row[12] || "").trim() || nameKey(row[1]);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      })
      .map(row => ({
        name: row[1].trim(),
        link: row[4] || "#",                       // "Link to edit"
        citations: parseInt(row[15], 10)           // column P
      }));

    if (candidates.length === 0) {
      container.textContent = "No articles currently need edits.";
      return;
    }

    // Pool = people with the lowest citation count, widened to the next-lowest
    // counts until it has at least EDIT_POOL_MIN people
    const counts = [...new Set(candidates.map(c => c.citations))].sort((a, b) => a - b);
    let pool = [];
    for (const count of counts) {
      pool = pool.concat(candidates.filter(c => c.citations === count));
      if (pool.length >= Math.max(EDIT_POOL_MIN, 3)) break;
    }

    renderSuggestions("Try editing one of these:", pickRandom(pool, 3));
  }

  Promise.all([
    fetch(csvUrl).then(res => res.text()),
    fetch(articlesCsvUrl).then(res => res.text()).catch(() => "")
  ]).then(([csv, articlesCsv]) => {

    articlesData = parseCsv(articlesCsv);
    fullData = parseCsv(csv).filter(row => row.length >= 4);

    // Populate filter dropdown with unique values from Column C (index 2)
    const uniqueSteps = [...new Set(fullData.map(row => row[2]).filter(x => x))];
    const filterSelect = document.getElementById("filterSelect");
    uniqueSteps.forEach(step => {
      const opt = document.createElement("option");
      opt.value = step;
      opt.textContent = step;
      filterSelect.appendChild(opt);
    });

    document.getElementById("searchInput").addEventListener("input", () => {
      currentPage = 1;
      render();
    });

    document.getElementById("filterSelect").addEventListener("change", () => {
      currentPage = 1;
      render();
    });

    document.getElementById("suggestBtn").addEventListener("click", suggestBiographies);
    document.getElementById("editBtn").addEventListener("click", suggestEdits);

    render();
  });
</script>

</body>
</html>
